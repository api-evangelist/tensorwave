notes: 'TensorWave ships no client library for its own GPU cloud platform, because that platform
  is consumed over SSH, Slurm and Kubernetes rather than a REST API. The one first-party package
  is the ScalarLM SDK/CLI. The TensorWave GitHub organization (tensorwavecloud) additionally
  carries forks of vLLM, DeepSpeed, axolotl, TRL, LLaMA-Factory, flash-attention, kserve, the AMD
  k8s-device-plugin and the Slinky slurm-operator, plus two original Go/Rust tools
  (terraform-provider-proxmox, commandant-rs); none of those are distributed as a TensorWave
  client SDK and so are not listed as packages here.'
