summary: 'ScalarLM has two loosely-coupled entity clusters joined by the checkpoint. On the
  inference side an InferenceRequest is enqueued, claimed by a Worker as a WorkItem and closed
  with a Result. On the training side a Dataset is uploaded (optionally through a chunked Upload),
  becomes a TrainingJob dispatched as a SlurmJob, which writes Checkpoints, one of which can be
  pushed to Hugging Face through a PublishJob. The Model that inference serves is loaded from a
  checkpoint the training side produced - that shared checkpoint is the whole point of the stack
  and the only real join between the two clusters.'
identifiers:
- entity: InferenceRequest
  field: request_id
  type: string
- entity: TrainingJob
  field: job_hash
  type: string
  note: Content-addressed hash, used as the path segment for every training sub-resource.
- entity: Upload
  field: upload_id
  type: string
- entity: SlurmJob
  field: job_id
  type: string
- entity: Model
  field: model_name
  type: string
- entity: Adaptor
  field: name
  type: string
entities:
- name: InferenceRequest
  schemas: [GenerateRequest, Result]
  operations: [generate, getResults, listRequests, getRequestDetail, downloadGenerateData,
    uploadGenerateData]
  fields: [request_id, model, prompts, max_tokens, temperature, tools, tool_choice]
  lifecycle: enqueued -> claimed (getWork) -> finished (finishWork) -> readable (getResults)
- name: Result
  schemas: [Result, GenerateResponse]
  fields: [request_id, response, error]
  note: response is either a completion string or an embedding vector (list of floats).
- name: WorkItem
  schemas: [GetWorkResponse, GetWorkResponses]
  operations: [getWork, finishWork]
  fields: [request_id, prompt, request_type, model, max_tokens]
  note: The worker-facing projection of an InferenceRequest.
- name: Worker
  schemas: [GetWorkRequest, FinishWorkRequest]
  operations: [getWork, finishWork, getAdaptors]
  fields: [batch_size, loaded_adaptor_count, token_count, prompt_tokens, completion_tokens,
    flop_count]
  note: Not a stored resource; identified only by what it declares on each poll.
- name: Adaptor
  schemas: [GetAdaptorsRequest, GetAdaptorsResponse]
  operations: [getAdaptors, getWork]
  note: LoRA adaptors distributed to workers; delivered as a delta against loaded_adaptor_count.
- name: Model
  schemas: [ListModelsResponse]
  operations: [listModels, listDeployedModels]
- name: TrainingJob
  schemas: [TrainResponse]
  operations: [submitTrainingJob, finalizeChunkedUpload, getTrainingJob, cancelTrainingJob,
    restartTrainingJob, deleteTrainingJob, getTrainingLogs]
  fields: [job_hash, job_status, job_config, deployed]
- name: Dataset
  operations: [getTrainingDataset, downloadTrainingDataset]
  format: dataset.jsonlines
  note: Owned by a TrainingJob; addressed only under /train/{job_hash}/dataset.
- name: Upload
  schemas: [UploadInitRequest, UploadInitResponse, UploadChunkResponse, UploadFinalizeRequest]
  operations: [initChunkedUpload, uploadChunk, finalizeChunkedUpload]
  fields: [upload_id, total_size, total_hash, chunk_size, num_chunks, compressed, params,
    received_chunks]
- name: Checkpoint
  operations: [listCheckpoints, publishToHuggingFace]
  naming: checkpoint_<step>.pt
- name: PublishJob
  schemas: [PublishRequest]
  operations: [publishToHuggingFace, getPublishStatus, cancelPublish, getPublishLogs]
  fields: [mode, repo_id, private, hf_token, checkpoint, lora_alpha, commit_message]
- name: SlurmJob
  schemas: [SqueueResponse]
  operations: [getSlurmStatus, getSlurmSqueue, cancelSlurmJob, getMegatronSqueue]
  fields: [job_id, squeue_output]
- name: Cluster
  schemas: [GetGPUCountResponse, GetNodeCountResponse, MetricsResponse]
  operations: [getGpuCount, getNodeCount, getGenerateMetrics, getPrometheusMetrics,
    getSlurmStatus, checkHealth]
