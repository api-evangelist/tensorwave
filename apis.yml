aid: tensorwave
name: TensorWave
description: 'TensorWave is a Las Vegas-headquartered AI cloud provider that builds and operates
  bare-metal GPU infrastructure exclusively on AMD Instinct accelerators (MI300X, MI325X, MI355X
  and MI455X) with AMD''s open ROCm software stack. The company sells dedicated GPU nodes,
  high-speed network storage, and managed Slurm and Kubernetes clusters for AI model training,
  fine-tuning and inference, with observability, job scheduling, alerting and expert support
  layered on top. Access to the compute platform itself is delivered over SSH, Slurm and
  Kubernetes rather than a public REST control-plane API. TensorWave''s public API surface is
  ScalarLM, the CC0-licensed unified training-and-inference stack it maintains and sponsors
  alongside RelationalAI, which exposes an OpenAI-compatible inference endpoint backed by vLLM
  together with a Megatron-LM training surface from a single deployment.'
