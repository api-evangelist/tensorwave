apis:
- aid: tensorwave:scalarlm
  name: ScalarLM API
  description: 'ScalarLM is the open-source (CC0-1.0) unified LLM training and inference stack
    maintained and sponsored by TensorWave. A single deployment exposes an OpenAI-compatible
    inference endpoint backed by vLLM (/v1/chat/completions, /v1/completions, /v1/models), a
    queue-backed batch generate surface with worker coordination, a Megatron-LM training surface
    dispatched through Slurm (chunked dataset upload, job control, checkpoints, publish-to-Hugging
    Face), plus Slurm scheduler and health/metrics endpoints. It runs unchanged on AMD and NVIDIA
    GPUs; TensorWave''s own deployments run on AMD MI300X.'
  humanURL: https://www.scalarlm.com/docs/
  baseURL: https://gpt-oss.cray-lm.com
