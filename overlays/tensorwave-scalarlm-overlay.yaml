  source: >-
    API Evangelist enrichment pass over openapi/tensorwave-scalarlm-openapi.yml, which is itself
    derived from the first-party FastAPI source at github.com/tensorwavecloud/ScalarLM.
actions:
- target: $.info
  update:
    x-apievangelist-provider: tensorwave
    x-apievangelist-api: tensorwave:scalarlm
    x-apievangelist-reviewed: '2026-08-02'
    x-apievangelist-artifacts:
      authentication: authentication/tensorwave-authentication.yml
      conventions: conventions/tensorwave-conventions.yml
      errors: errors/tensorwave-problem-types.yml
